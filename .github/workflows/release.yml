name: build-release

on:
  push:
    tags: ['v*']

env:
  # npm 11 的 allow-scripts 安全策略默认拦截安装脚本，这里显式放行内核所需脚本
  NPM_ALLOW: "@deepseek-ai/dsh-subprocess-local,koffi,node-pty,electron,@google/genai,protobufjs"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: npm ci --legacy-peer-deps --allow-scripts="$env:NPM_ALLOW" --no-audit --no-fund
      - name: Ensure electron binary
        run: |
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            node node_modules\electron\install.js
          }
      - name: Sync complete dsh kernel tree (npm 装出的树不完整)
        run: |
          npm i -g "@deepseek-ai/dsh@0.1.1-rc.2" --allow-scripts="$env:NPM_ALLOW" --no-audit --no-fund
          robocopy "$env:APPDATA\npm\node_modules\@deepseek-ai\dsh" "node_modules\@deepseek-ai\dsh" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -le 7) { exit 0 }
      - run: npm run icon
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Setup-*.exe
            dist/latest*.yml
            dist/*.blockmap
